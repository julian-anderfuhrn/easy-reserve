<header class="bg-white shadow">
    <nav class="container mx-auto p-4 flex justify-between">

        <div class="space-x-4">

            {% if user.is_authenticated %}
            <span>{{ user.username }}</span>
            <a href="{% url 'users:logout' %}">
                Log out
            </a>
            {% else %}
            <a href="{% url 'users:login' %}">Login</a>
            {% endif %}
        </div>
    </nav>
</header>
