{% extends "base.html" %}

{% block content %}
<div class="max-w-6xl mx-auto px-4 py-8">

    <h1 class="text-3xl font-bold mb-8 text-gray-800">
        Available Services
    </h1>

    {% if services %}
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

        {% for service in services %}
        <div
            class="bg-white rounded-2xl shadow-md hover:shadow-lg transition-shadow duration-300 p-6 flex flex-col justify-between">

            <div>
                <h2 class="text-xl font-semibold text-gray-900 mb-2">
                    {{ service.category }}
                </h2>

                <p class="text-sm text-gray-500 mb-4">
                    Professional: {{ service.owner }}
                </p>
            </div>

            <div class="mt-6">
                <a href="{% url 'appointments:availability' service.pk %}"
                    class="block text-center bg-blue-600 text-white py-2 px-4 rounded-xl hover:bg-blue-700 transition-colors duration-300">
                    View available slots
                </a>
            </div>

        </div>
        {% endfor %}

    </div>
    {% else %}
    <div class="text-center py-16">
        <h2 class="text-xl font-semibold text-gray-600">
            No services available at the moment
        </h2>
    </div>
    {% endif %}

</div>
{% endblock %}
